jobs:
  verilog-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show current directory
        run: pwd

      - name: List files
        run: ls -l

      - name: Compile Verilog
        run: iverilog -o test.out test.v

      - name: Run Verilog Simulation
        run: vvp test.out
